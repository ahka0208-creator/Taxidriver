<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚕 的士逐單計收支與淨收入結算簿</title>
    <style>
        :root {
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --primary: #FBBF24;       
            --income: #10B981;        
            --expense: #F87171;       
            --accent-blue: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
            --nav-height: 65px;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px 16px calc(var(--nav-height) + 20px) 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 頁面切換控制 */
        .tab-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            animation: fadeIn 0.2s ease-out;
        }
        .tab-content.active { display: flex; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= 每日專屬導航 ================= */
        .quick-jump-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: -6px;
        }
        .quick-jump-row span {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-main);
        }
        .jump-date-input {
            width: 160px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .day-nav-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .nav-arrow {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-arrow:active { transform: scale(0.9); }
        .day-nav-center {
            text-align: center;
            cursor: pointer;
        }
        .day-nav-title {
            font-size: 17px;
            font-weight: 900;
            color: var(--primary);
            letter-spacing: 0.5px;
        }
        .day-nav-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: bold;
        }

        /* ================= 獨立卡片設計 ================= */
        .info-card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 4px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-title.inc { color: var(--income); }
        .card-title.exp { color: var(--expense); }
        
        .header-val {
            font-size: 16px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
        }

        /* 網格與輸入框 */
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .field-box { display: flex; flex-direction: column; gap: 5px; }
        .field-box.full { grid-column: 1 / -1; }
        .field-box label {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .num-input, .date-input, .time-input, .note-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            transition: border 0.2s;
        }
        .time-input { font-size: 15px; padding: 10px; text-align: center; }
        .note-input { font-size: 14px; font-weight: normal; }
        .num-input:focus, .time-input:focus, .jump-date-input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.45);
        }

        /* 時間選擇區域調整 */
        .time-picker-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
        }
        .time-box { display: flex; flex-direction: column; gap: 4px; }
        .time-box label { font-size: 11px; color: var(--text-muted); }
        .duration-badge {
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.35);
            color: var(--accent-blue);
            font-size: 13px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 10px;
            white-space: nowrap;
        }

        /* 逐單記帳專屬 (清單式) */
        .trip-input-row { display: flex; gap: 8px; }
        .trip-add-btn {
            background: var(--income);
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .trip-add-btn:active { transform: scale(0.95); }
        
        .trip-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
            max-height: 240px; 
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 6px;
        }
        .trip-list::-webkit-scrollbar { display: none; }
        
        .trip-row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 10px 14px;
            border-radius: 10px;
            animation: slideIn 0.2s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .trip-idx { font-size: 13px; color: var(--text-muted); font-weight: bold; width: 60px; }
        .trip-amt { font-size: 18px; font-weight: 900; color: #34D399; }
        .trip-del-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* 結算面板與儲存按鈕 */
        .summary-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 1) 0%, rgba(15, 23, 42, 1) 100%);
            border: 1px solid rgba(251, 191, 36, 0.35);
        }
        .net-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }
        .net-label { font-size: 15px; font-weight: bold; color: var(--text-main); }
        .net-amount { font-size: 32px; font-weight: 900; color: var(--primary); }
        
        .save-btn {
            width: 100%;
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            color: #111827;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
            margin-top: 4px;
        }
        .save-btn:active { transform: scale(0.98); }

        .del-day-btn {
            background: transparent;
            color: var(--expense);
            border: 1px solid rgba(248, 113, 113, 0.3);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: none; 
        }

        /* ================= 月份統計與歷史 (Tab 2) ================= */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .stat-box.month-highlight {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(28, 33, 46, 1) 100%);
            border-color: rgba(251, 191, 36, 0.4);
            grid-column: 1 / -1;
        }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: bold; }
        .stat-val { font-size: 20px; font-weight: 900; color: var(--text-main); }
        .stat-box.month-highlight .stat-val { color: var(--primary); font-size: 26px; }

        .history-list { display: flex; flex-direction: column; gap: 14px; }
        .day-group-card {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            transition: 0.1s;
        }
        .day-group-card:active { transform: scale(0.98); }
        .day-group-card.loss { border-left-color: var(--expense); }
        
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .day-title { font-size: 15px; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        .day-net-val { font-size: 20px; font-weight: 900; color: var(--primary); }

        .shift-subitem {
            display: flex; flex-direction: column; gap: 4px;
            padding: 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.03); font-size: 12px;
        }
        .trip-detail-text {
            font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.5;
            border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 6px;
        }

        .footer-tools { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
        .tool-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--text-muted); padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer;
        }

        /* ================= 底部導航列 ================= */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: var(--nav-height);
            background: rgba(28, 33, 46, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-icon { font-size: 22px; margin-bottom: 2px; }
        .nav-item.active { color: var(--primary); }
        .nav-item.active .nav-icon { text-shadow: 0 0 10px var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <!-- ================= 版面 1：每日入數 (Tab Daily) ================= -->
    <div id="tabDaily" class="tab-content active">
        
        <!-- 新增：獨立選擇日期跳轉行 -->
        <div class="quick-jump-row">
            <span>📅 選擇日期：</span>
            <input type="date" id="workDate" class="jump-date-input" onchange="onDateChange()">
        </div>

        <!-- 每日專屬導航 -->
        <div class="day-nav-bar">
            <button class="nav-arrow" onclick="stepDay(-1)">◀</button>
            <div class="day-nav-center" onclick="jumpToToday()">
                <div class="day-nav-title" id="dayNavTitle">11月17日 (星期二)</div>
                <div class="day-nav-sub" id="dayNavSub">📍 點擊返回今日</div>
            </div>
            <button class="nav-arrow" onclick="stepDay(1)">▶</button>
        </div>

        <!-- 1. 時間卡片 -->
        <div class="info-card">
            <div class="card-header">
                <h3 class="card-title">🕒 當值時間</h3>
                <span class="duration-badge" id="durationBadge">⏱️ 6 小時</span>
            </div>
            <div class="time-picker-grid">
                <div class="time-box">
                    <label>🟢 取車</label>
                    <input type="time" id="startTime" class="time-input" value="14:00" onchange="onTimeChange()">
                </div>
                <div style="color:var(--text-muted); font-weight:bold; padding-top:16px;">➔</div>
                <div class="time-box">
                    <label>🔴 還車</label>
                    <input type="time" id="endTime" class="time-input" value="20:00" onchange="onTimeChange()">
                </div>
            </div>
        </div>

        <!-- 2. 收入卡片 (逐單輸入) -->
        <div class="info-card">
            <div class="card-header">
                <h3 class="card-title inc">➕ 營業額 (車資)</h3>
                <span class="header-val" id="liveIncText" style="color:var(--income);">+$0</span>
            </div>
            <div class="field-box full">
                <div class="trip-input-row">
                    <input type="number" inputmode="decimal" id="tripAmount" class="num-input" placeholder="輸入單程車資 (例: 85)" onkeypress="if(event.key==='Enter') addTrip()">
                    <button class="trip-add-btn" onclick="addTrip()">➕ 記單</button>
                </div>
                <div class="trip-list" id="tripListContainer"></div>
            </div>
        </div>

        <!-- 3. 開支卡片 -->
        <div class="info-card">
            <div class="card-header">
                <h3 class="card-title exp">➖ 開支成本</h3>
                <span class="header-val" id="liveExpText" style="color:var(--expense);">-$0</span>
            </div>
            <div class="input-grid">
                <div class="field-box">
                    <label>
                        <span>🚕 車租 ($)</span>
                        <span style="color:var(--accent-blue); cursor:pointer;" onclick="fillLastRent()">[上次車租]</span>
                    </label>
                    <input type="number" inputmode="decimal" id="expRent" class="num-input" placeholder="0" oninput="onDirectRentInput()">
                </div>
                <div class="field-box">
                    <label><span>⏱️ 時租 ($/h)</span></label>
                    <input type="number" inputmode="decimal" id="hourlyRate" class="num-input" placeholder="自動計租" oninput="onHourlyRateInput()">
                </div>
                <div class="field-box">
                    <label>⛽ 入氣 ($)</label>
                    <input type="number" inputmode="decimal" id="expGas" class="num-input" placeholder="0" oninput="calcLive()">
                </div>
                <div class="field-box">
                    <label>🛣️ 隧道/雜費 ($)</label>
                    <input type="number" inputmode="decimal" id="expTunnel" class="num-input" placeholder="0" oninput="calcLive()">
                </div>
                <div class="field-box full">
                    <input type="text" id="shiftNote" class="note-input" placeholder="📝 備註 (例如：落雨、特別更...)">
                </div>
            </div>
        </div>

        <!-- 4. 結算與儲存 -->
        <div class="info-card summary-card">
            <div class="net-row">
                <span class="net-label">💰 該日落袋淨收：</span>
                <span class="net-amount" id="resNetProfit">$0</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:10px;">
                <span>平均時薪: <strong id="resHourlyProfit" style="color:var(--accent-blue);">$0</strong></span>
                <span id="tripCountSummary">共 0 單</span>
            </div>
            
            <button class="save-btn" onclick="saveDayRecord()">💾 儲存今日紀錄</button>
            <button class="del-day-btn" id="delDayBtn" onclick="deleteCurrentDay()">🗑️ 刪除此日紀錄</button>
        </div>
    </div>

    <!-- ================= 版面 2：每月結算 (Tab Monthly) ================= -->
    <div id="tabMonthly" class="tab-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0; font-size:20px; color:var(--primary);">📊 每月成績表</h2>
            <input type="month" id="filterMonth" style="background:rgba(255,255,255,0.1); border:1px solid var(--border); color:#fff; padding:6px 10px; border-radius:8px; font-size:14px; outline:none;" onchange="renderMonthlyTab()">
        </div>

        <!-- 當月統計 3 格 -->
        <div class="stats-grid" style="grid-template-columns: 1fr;">
            <div class="stat-box month-highlight">
                <span class="stat-label">💰 本月累積淨收入</span>
                <span class="stat-val" id="statMonthNet">$0</span>
            </div>
        </div>
        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-label">📊 每日平均淨賺</span>
                <span class="stat-val" id="statAvgDailyNet">$0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">⏱️ 本月開工日數</span>
                <span class="stat-val" id="statWorkDays" style="font-size:17px;">0 日 (0h)</span>
            </div>
        </div>

        <!-- 歷史列表 -->
        <div class="history-list" id="historyList"></div>

        <div class="footer-tools">
            <button class="tool-btn" onclick="exportData()">📤 匯出備份檔</button>
            <button class="tool-btn" onclick="document.getElementById('importInput').click()">📥 匯入還原</button>
            <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
        </div>
    </div>
</div>

<!-- ================= 底部導航列 ================= -->
<div class="bottom-nav">
    <div class="nav-item active" id="navDaily" onclick="switchTab('Daily')">
        <div class="nav-icon">📝</div>
        <div>每日入數</div>
    </div>
    <div class="nav-item" id="navMonthly" onclick="switchTab('Monthly')">
        <div class="nav-icon">📊</div>
        <div>每月結算</div>
    </div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('hk_taxi_ledger_v6')) || [];
    
    let currentViewDateObj = new Date(); 
    let currentHours = 6;
    let currentTrips = []; 
    let currentEditingId = null;

    const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

    window.onload = () => {
        const savedStart = localStorage.getItem('hk_taxi_start_time');
        const savedEnd = localStorage.getItem('hk_taxi_end_time');
        if (savedStart) document.getElementById('startTime').value = savedStart;
        if (savedEnd) document.getElementById('endTime').value = savedEnd;

        const yyyy = currentViewDateObj.getFullYear();
        const mm = String(currentViewDateObj.getMonth() + 1).padStart(2, '0');
        document.getElementById('filterMonth').value = `${yyyy}-${mm}`;

        loadDayData(currentViewDateObj);
    };

    // ================= 分頁控制 =================
    function switchTab(tabName) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        document.getElementById('tab' + tabName).classList.add('active');
        document.getElementById('nav' + tabName).classList.add('active');
        
        if (tabName === 'Monthly') {
            renderMonthlyTab();
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ================= 每日導航邏輯 =================
    function getFormattedDate(dObj) {
        const y = dObj.getFullYear();
        const m = String(dObj.getMonth() + 1).padStart(2, '0');
        const d = String(dObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function jumpToToday() {
        currentViewDateObj = new Date();
        loadDayData(currentViewDateObj);
    }

    function stepDay(delta) {
        currentViewDateObj.setDate(currentViewDateObj.getDate() + delta);
        loadDayData(currentViewDateObj);
    }

    function onDateChange() {
        const newDateStr = document.getElementById('workDate').value;
        if (newDateStr) {
            currentViewDateObj = new Date(newDateStr);
            loadDayData(currentViewDateObj);
        }
    }

    function jumpToSpecificDay(dateStr) {
        currentViewDateObj = new Date(dateStr);
        loadDayData(currentViewDateObj);
        switchTab('Daily');
    }

    // 載入指定日期的資料去畫面
    function loadDayData(dObj) {
        const dateStr = getFormattedDate(dObj);
        document.getElementById('workDate').value = dateStr; // 同步更新頂部選擇日期
        
        // 更新導航標題
        const m = dObj.getMonth() + 1;
        const d = dObj.getDate();
        const w = WEEKDAYS[dObj.getDay()];
        document.getElementById('dayNavTitle').innerText = `${m}月${d}日 (星期${w})`;

        const now = new Date();
        const isToday = (dateStr === getFormattedDate(now));
        document.getElementById('dayNavSub').innerText = isToday ? "📍 今日" : "點擊返回今日";

        const record = records.find(r => r.date === dateStr);
        
        if (record) {
            currentEditingId = record.id;
            document.getElementById('startTime').value = record.startTime;
            document.getElementById('endTime').value = record.endTime;
            currentTrips = [...(record.trips || [])];
            
            document.getElementById('expRent').value = record.rent || '';
            document.getElementById('hourlyRate').value = ''; 
            document.getElementById('expGas').value = record.gas || '';
            document.getElementById('expTunnel').value = record.tunnel || '';
            document.getElementById('expOther').value = record.other || '';
            document.getElementById('shiftNote').value = record.note || '';

            document.getElementById('delDayBtn').style.display = 'block';
        } else {
            currentEditingId = null;
            currentTrips = [];
            
            const savedHourlyRate = localStorage.getItem('hk_taxi_hourly_rate');
            const lastRent = localStorage.getItem('hk_taxi_last_rent');
            
            calcDurationHours();
            if (savedHourlyRate) {
                document.getElementById('hourlyRate').value = savedHourlyRate;
                document.getElementById('expRent').value = Math.round(parseFloat(savedHourlyRate) * currentHours);
            } else if (lastRent) {
                document.getElementById('expRent').value = lastRent;
                document.getElementById('hourlyRate').value = '';
            } else {
                document.getElementById('expRent').value = '';
                document.getElementById('hourlyRate').value = '';
            }
            
            document.getElementById('expGas').value = '';
            document.getElementById('expTunnel').value = '';
            document.getElementById('expOther').value = '';
            document.getElementById('shiftNote').value = '';

            document.getElementById('delDayBtn').style.display = 'none';
        }

        renderTrips();
        calcLive();
    }

    // ================= 時間與計算 =================
    function calcDurationHours() {
        const startStr = document.getElementById('startTime').value;
        const endStr = document.getElementById('endTime').value;
        if (!startStr || !endStr) {
            currentHours = 0;
            document.getElementById('durationBadge').innerText = `⏱️ 共 0 小時`;
            return;
        }

        const [sh, sm] = startStr.split(':').map(Number);
        const [eh, em] = endStr.split(':').map(Number);

        let startMinutes = sh * 60 + sm;
        let endMinutes = eh * 60 + em;

        if (endMinutes <= startMinutes) {
            endMinutes += 24 * 60;
        }

        const diffHours = (endMinutes - startMinutes) / 60;
        currentHours = Math.round(diffHours * 10) / 10;
        document.getElementById('durationBadge').innerText = `⏱️ 共 ${currentHours} 小時`;
    }

    function onTimeChange() {
        calcDurationHours();
        const rate = getVal('hourlyRate');
        if (rate > 0) {
            document.getElementById('expRent').value = Math.round(rate * currentHours);
        }
        calcLive();
    }

    function onHourlyRateInput() {
        const rate = getVal('hourlyRate');
        if (rate > 0) {
            document.getElementById('expRent').value = Math.round(rate * currentHours);
            localStorage.setItem('hk_taxi_hourly_rate', rate);
        } else {
            localStorage.removeItem('hk_taxi_hourly_rate');
        }
        calcLive();
    }

    function onDirectRentInput() {
        document.getElementById('hourlyRate').value = '';
        localStorage.removeItem('hk_taxi_hourly_rate');
        calcLive();
    }

    function fillLastRent() {
        const lastRent = localStorage.getItem('hk_taxi_last_rent');
        if (lastRent) {
            document.getElementById('expRent').value = lastRent;
            calcLive();
        } else {
            alert('暫時未有上次車租紀錄');
        }
    }

    function getVal(id) {
        return parseFloat(document.getElementById(id).value) || 0;
    }

    function formatMoney(num) {
        return (num >= 0 ? '$' : '-$') + Math.abs(Math.round(num)).toLocaleString();
    }

    // ================= 逐單記帳 (清單式) =================
    function addTrip() {
        const input = document.getElementById('tripAmount');
        const val = parseFloat(input.value);
        if (!val || val <= 0) return;
        
        currentTrips.push(val);
        input.value = ''; 
        input.focus();    
        renderTrips();
        calcLive();
    }

    function removeTrip(index) {
        currentTrips.splice(index, 1);
        renderTrips();
        calcLive();
    }

    function renderTrips() {
        const container = document.getElementById('tripListContainer');
        container.innerHTML = '';
        
        if (currentTrips.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:12px; padding:16px 0;">尚未輸入任何車資，請在上方輸入並撳「➕ 記單」</div>`;
            return;
        }

        [...currentTrips].reverse().forEach((amt, reversedIdx) => {
            const realIdx = currentTrips.length - 1 - reversedIdx;
            container.innerHTML += `
                <div class="trip-row-item">
                    <div style="display:flex; align-items:baseline; gap:12px;">
                        <span class="trip-idx">第 ${realIdx + 1} 單</span>
                        <span class="trip-amt">$${amt}</span>
                    </div>
                    <button class="trip-del-btn" onclick="removeTrip(${realIdx})" title="刪除此單">✕</button>
                </div>
            `;
        });
    }

    function calcLive() {
        const totalInc = currentTrips.reduce((sum, amt) => sum + amt, 0);
        const rent = getVal('expRent');
        const gas = getVal('expGas');
        const tunnel = getVal('expTunnel');
        const other = getVal('expOther');
        const totalExp = rent + gas + tunnel + other;

        const net = totalInc - totalExp;
        const hourlyProfit = currentHours > 0 ? net / currentHours : 0;

        document.getElementById('liveIncText').innerText = `+$${totalInc.toFixed(0)}`;
        document.getElementById('liveExpText').innerText = `-$${totalExp.toFixed(0)}`;
        
        const netEl = document.getElementById('resNetProfit');
        netEl.innerText = formatMoney(net);
        netEl.style.color = net >= 0 ? 'var(--primary)' : 'var(--expense)';

        document.getElementById('resHourlyProfit').innerText = `${formatMoney(hourlyProfit)}`;
        document.getElementById('tripCountSummary').innerText = `共 ${currentTrips.length} 單`;
    }

    // ================= 儲存紀錄 =================
    function saveDayRecord() {
        const dateStr = getFormattedDate(currentViewDateObj);
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;

        const totalInc = currentTrips.reduce((sum, amt) => sum + amt, 0);
        const tripCount = currentTrips.length;

        const rent = getVal('expRent');
        const gas = getVal('expGas');
        const tunnel = getVal('expTunnel');
        const other = getVal('expOther');
        const totalExp = rent + gas + tunnel + other;
        const note = document.getElementById('shiftNote').value.trim();

        if (totalInc === 0 && totalExp === 0) {
            alert('請先輸入單程車資或車租開支！');
            return;
        }

        localStorage.setItem('hk_taxi_start_time', startTime);
        localStorage.setItem('hk_taxi_end_time', endTime);
        if (rent > 0) localStorage.setItem('hk_taxi_last_rent', rent);

        const recordData = {
            date: dateStr,
            shift: `🕒 ${startTime}-${endTime} (${currentHours}h)`,
            startTime,
            endTime,
            hours: currentHours,
            trips: [...currentTrips],
            tripCount,
            totalInc,
            rent,
            gas,
            tunnel,
            other,
            totalExp,
            net: totalInc - totalExp,
            note
        };

        if (currentEditingId) {
            recordData.id = currentEditingId;
            const index = records.findIndex(r => r.id === currentEditingId);
            if (index !== -1) records[index] = recordData;
        } else {
            recordData.id = 'tx-' + Date.now();
            records.push(recordData);
        }

        records.sort((a, b) => b.date.localeCompare(a.date));
        localStorage.setItem('hk_taxi_ledger_v6', JSON.stringify(records));

        loadDayData(currentViewDateObj);
        alert('✅ 已儲存此日結算！');
    }

    function deleteCurrentDay() {
        if (!confirm('確定要刪除此日紀錄嗎？')) return;
        records = records.filter(r => r.id !== currentEditingId);
        localStorage.setItem('hk_taxi_ledger_v6', JSON.stringify(records));
        loadDayData(currentViewDateObj);
    }

    // ================= 渲染每月結算 (Tab 2) =================
    function renderMonthlyTab() {
        const selectedMonth = document.getElementById('filterMonth').value;
        const listEl = document.getElementById('historyList');
        listEl.innerHTML = '';

        const filtered = selectedMonth
            ? records.filter(r => r.date.startsWith(selectedMonth))
            : records;

        let monthNet = 0;
        let monthHours = 0;
        
        filtered.forEach(r => {
            monthNet += r.net;
            monthHours += (r.hours || 0);
        });

        const uniqueWorkDays = filtered.length;
        const avgDailyNet = uniqueWorkDays > 0 ? Math.round(monthNet / uniqueWorkDays) : 0;
        monthHours = Math.round(monthHours * 10) / 10;

        document.getElementById('statMonthNet').innerText = formatMoney(monthNet);
        document.getElementById('statWorkDays').innerText = `${uniqueWorkDays} 日 (${monthHours}h)`;
        document.getElementById('statAvgDailyNet').innerText = formatMoney(avgDailyNet);

        if (filtered.length === 0) {
            listEl.innerHTML = `<div style="text-align:center; padding:40px 0; color:var(--text-muted); font-size:14px;">呢個月暫時未有出車紀錄</div>`;
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = `day-group-card ${item.net < 0 ? 'loss' : ''}`;
            card.onclick = () => jumpToSpecificDay(item.date);

            let expBreakdown = [];
            if (item.rent > 0) expBreakdown.push(`租 $${item.rent}`);
            if (item.gas > 0) expBreakdown.push(`氣 $${item.gas}`);
            if (item.tunnel > 0) expBreakdown.push(`隧道 $${item.tunnel}`);
            if (item.other > 0) expBreakdown.push(`雜 $${item.other}`);

            const tripLabel = item.tripCount > 0 ? `(共 ${item.tripCount} 單)` : '';
            const hoursLabel = item.hours > 0 ? `<span class="day-hours-tag">⏱️ ${item.hours}h</span>` : '';

            let tripDetailsHtml = '';
            if (item.trips && item.trips.length > 0) {
                tripDetailsHtml = `
                    <div class="trip-detail-text">
                        🧾 <strong>車資明細：</strong> ${item.trips.map(t => '$'+t).join('、')}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="day-header">
                    <div class="day-title">
                        <span>📅 ${item.date}</span>
                        ${hoursLabel}
                    </div>
                    <div class="day-net-val" style="color:${item.net >= 0 ? 'var(--primary)' : 'var(--expense)'}">
                        ${formatMoney(item.net)}
                    </div>
                </div>
                <div class="day-summary-pills">
                    <span style="color:var(--income); font-weight:bold;">收: +$${item.totalInc} ${tripLabel}</span>
                    <span style="color:var(--expense);">支: -$${item.totalExp} (${expBreakdown.join(' · ') || '無'})</span>
                </div>
                ${tripDetailsHtml}
                ${item.note ? `<div style="color:#CBD5E1; font-size:12px; margin-top:8px;">📝 ${item.note}</div>` : ''}
            `;
            listEl.appendChild(card);
        });
    }

    // 備份還原
    function exportData() {
        if (records.length === 0) return alert('暫時無紀錄可以匯出！');
        const blob = new Blob([JSON.stringify(records)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `taxi-diary-ledger-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importData(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (!Array.isArray(imported)) throw new Error();
                records = imported;
                localStorage.setItem('hk_taxi_ledger_v6', JSON.stringify(records));
                loadDayData(currentViewDateObj);
                alert('✅ 成功還原出車紀錄！');
            } catch {
                alert('⚠️ 備份檔案格式不正確！');
            }
        };
        reader.readAsText(file);
    }
</script>
