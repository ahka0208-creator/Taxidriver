<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🚕 的士逐單計收支與淨收入結算簿</title>
    <style>
        :root {
            --bg-dark: #12151E;
            --bg-card: #1C212E;
            --primary: #FBBF24;       /* 金色：淨收入 */
            --income: #10B981;        /* 綠色：營業額 */
            --expense: #F87171;       /* 紅色：開支成本 */
            --accent-blue: #60A5FA;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 2px;
        }
        .header h2 {
            margin: 0 0 4px 0;
            font-size: 22px;
            color: var(--primary);
            letter-spacing: 0.5px;
        }
        .header p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* 頂部 2x2 每日及每月統計儀表板 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stat-box.today-highlight {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.18) 0%, rgba(28, 33, 46, 1) 100%);
            border-color: rgba(16, 185, 129, 0.4);
        }
        .stat-box.month-highlight {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.18) 0%, rgba(28, 33, 46, 1) 100%);
            border-color: rgba(251, 191, 36, 0.4);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: bold;
        }
        .stat-val {
            font-size: 20px;
            font-weight: 900;
            color: var(--text-main);
        }
        .stat-box.today-highlight .stat-val { color: #34D399; font-size: 22px; }
        .stat-box.month-highlight .stat-val { color: var(--primary); font-size: 22px; }

        /* 卡片通用樣式 */
        .card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            transition: all 0.3s ease;
        }
        /* 編輯模式時高亮輸入卡片 */
        .card.edit-mode {
            border: 2px solid #10B981;
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 800;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 日期與時租時間選擇區塊 */
        .time-panel {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .date-duration-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .duration-badge {
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.35);
            color: var(--accent-blue);
            font-size: 13px;
            font-weight: 800;
            padding: 8px 12px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .time-picker-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 8px;
        }
        .time-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .time-box label {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* 輸入欄位網格 */
        .group-label {
            font-size: 13px;
            font-weight: bold;
            margin: 14px 0 8px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }
        .group-label.inc { color: var(--income); }
        .group-label.exp { color: var(--expense); }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .field-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .field-box.full {
            grid-column: 1 / -1;
        }
        .field-box label {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .num-input, .date-input, .time-input, .note-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            transition: border 0.2s;
        }
        .date-input { font-size: 14px; padding: 9px 12px; flex: 1; }
        .time-input { font-size: 15px; padding: 10px; text-align: center; }
        .note-input { font-size: 14px; font-weight: normal; }
        .num-input:focus, .time-input:focus, .date-input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.45);
        }

        /* ================= 逐單記帳專屬樣式 (清單式) ================= */
        .trip-input-row {
            display: flex;
            gap: 8px;
        }
        .trip-add-btn {
            background: var(--income);
            color: #000;
            border: none;
            padding: 0 16px;
            border-radius: 10px;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .trip-add-btn:active { transform: scale(0.95); }
        
        .trip-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
            max-height: 240px; /* 限制高度，多咗會捲動 */
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 6px;
        }
        /* 隱藏捲軸令畫面更乾淨 */
        .trip-list::-webkit-scrollbar { display: none; }
        
        .trip-row-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 10px 14px;
            border-radius: 10px;
            animation: slideIn 0.2s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .trip-idx {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: bold;
            width: 55px; /* 固定闊度等金額對齊 */
        }
        .trip-amt {
            font-size: 18px;
            font-weight: 900;
            color: #34D399;
        }
        .trip-del-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .trip-del-btn:active { background: rgba(239, 68, 68, 0.4); }

        /* 實時結算看板 */
        .live-result-box {
            background: rgba(0, 0, 0, 0.38);
            border: 1px solid rgba(251, 191, 36, 0.35);
            border-radius: 14px;
            padding: 14px 16px;
            margin: 18px 0 14px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sub-calc-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }
        .net-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
        }
        .net-label {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-main);
        }
        .net-amount {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
        }
        .hourly-rate-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--accent-blue);
        }
        .day-combined-row {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: rgba(16, 185, 129, 0.12);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #34D399;
            margin-top: 2px;
        }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .save-btn {
            width: 100%;
            background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
            color: #111827;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.25);
            transition: all 0.2s;
        }
        .save-btn:active { transform: scale(0.98); }
        .cancel-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: none; /* 預設隱藏，編輯模式才顯示 */
        }

        /* 每日淨收入列表樣式 */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .day-group-card {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .day-group-card.loss {
            border-left-color: var(--expense);
        }
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .day-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .day-hours-tag {
            font-size: 11px;
            color: var(--accent-blue);
            background: rgba(96, 165, 250, 0.12);
            padding: 2px 6px;
            border-radius: 6px;
            font-weight: bold;
        }
        .day-net-badge {
            text-align: right;
        }
        .day-net-label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
        }
        .day-net-val {
            font-size: 20px;
            font-weight: 900;
            color: var(--primary);
        }
        .day-summary-pills {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* 單次租車明細行 */
        .shift-subitem {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 12px;
        }
        .shift-sub-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .shift-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(251, 191, 36, 0.15);
            color: var(--primary);
        }
        .action-icon-btns {
            display: flex;
            gap: 2px;
        }
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            padding: 2px 6px;
        }
        .icon-btn.edit-btn:hover { color: #34D399; }
        .icon-btn.del-btn:hover { color: var(--expense); }

        .footer-tools {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 14px;
        }
        .tool-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚕 的士時租收支結算簿</h2>
        <p>做完一單入一筆 · 清單式實時對數</p>
    </div>

    <!-- 頂部 2x2 統計看板 -->
    <div class="stats-grid">
        <div class="stat-box today-highlight">
            <span class="stat-label" id="selectedDayLabel">📅 今日淨收入</span>
            <span class="stat-val" id="statTodayNet">$0</span>
        </div>
        <div class="stat-box month-highlight">
            <span class="stat-label">💰 本月累積淨收入</span>
            <span class="stat-val" id="statMonthNet">$0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">📊 每日平均淨收入</span>
            <span class="stat-val" id="statAvgDailyNet">$0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">⏱️ 本月開工日數 / 時數</span>
            <span class="stat-val" id="statWorkDays" style="font-size:17px;">0 日 (0h)</span>
        </div>
    </div>

    <!-- 入數主卡片 -->
    <div class="card" id="inputCard">
        <!-- 日期與時租時間選擇器 -->
        <div class="time-panel">
            <div class="date-duration-row">
                <input type="date" id="workDate" class="date-input" onchange="onDateChange()">
                <div class="duration-badge" id="durationBadge">⏱️ 共 6 小時</div>
            </div>
            <div class="time-picker-grid">
                <div class="time-box">
                    <label>🟢 取車時間</label>
                    <input type="time" id="startTime" class="time-input" value="14:00" onchange="onTimeChange()">
                </div>
                <div style="color:var(--text-muted); font-weight:bold; padding-top:16px;">➔</div>
                <div class="time-box">
                    <label>🔴 還車時間</label>
                    <input type="time" id="endTime" class="time-input" value="20:00" onchange="onTimeChange()">
                </div>
            </div>
        </div>

        <!-- 收入部分 (逐單輸入清單式) -->
        <div class="group-label inc">
            <span>➕ 記低每單車資 (自動計總數)</span>
            <span id="liveIncText">+$0</span>
        </div>
        <div class="input-grid">
            <div class="field-box full">
                <label>💵 輸入單程車資 ($)</label>
                <div class="trip-input-row">
                    <input type="number" inputmode="decimal" id="tripAmount" class="num-input" placeholder="例如: 85" onkeypress="if(event.key==='Enter') addTrip()">
                    <button class="trip-add-btn" onclick="addTrip()">➕ 記數</button>
                </div>
                <!-- 垂直清單式顯示每一項 -->
                <div class="trip-list" id="tripListContainer"></div>
            </div>
        </div>

        <!-- 開支部分 -->
        <div class="group-label exp">
            <span>➖ 出車開支成本</span>
            <span id="liveExpText">-$0</span>
        </div>
        <div class="input-grid">
            <div class="field-box">
                <label>
                    <span>🚕 今次車租總額 ($)</span>
                    <span style="color:var(--primary); cursor:pointer;" onclick="fillLastRent()">[上次車租]</span>
                </label>
                <input type="number" inputmode="decimal" id="expRent" class="num-input" placeholder="幾錢租" oninput="onDirectRentInput()">
            </div>
            <div class="field-box">
                <label>
                    <span>⏱️ 按時租自動計 (選填)</span>
                </label>
                <input type="number" inputmode="decimal" id="hourlyRate" class="num-input" placeholder="$/小時 (可不填)" oninput="onHourlyRateInput()">
            </div>
            <div class="field-box">
                <label>⛽ 入氣 (石油氣)</label>
                <input type="number" inputmode="decimal" id="expGas" class="num-input" placeholder="0" oninput="calcLive()">
            </div>
            <div class="field-box">
                <label>🛣️ 隧道費</label>
                <input type="number" inputmode="decimal" id="expTunnel" class="num-input" placeholder="0" oninput="calcLive()">
            </div>
            <div class="field-box full">
                <label>🧽 其他雜費 (洗車 / 茶水 / 泊車)</label>
                <input type="number" inputmode="decimal" id="expOther" class="num-input" placeholder="0" oninput="calcLive()">
            </div>
            <div class="field-box full">
                <input type="text" id="shiftNote" class="note-input" placeholder="📝 備註 (例如：落雨旺場、交車入氣...)">
            </div>
        </div>

        <!-- 實時結算看板 -->
        <div class="live-result-box">
            <div class="sub-calc-row">
                <span>總營業額：<strong id="resTotalInc" style="color:var(--income);">$0</strong></span>
                <span>總開支：<strong id="resTotalExp" style="color:var(--expense);">$0</strong></span>
            </div>
            <div class="net-row">
                <span class="net-label">💰 呢轉落袋淨收入：</span>
                <span class="net-amount" id="resNetProfit">$0</span>
            </div>
            <div class="hourly-rate-row">
                <span>⚡ 呢轉平均時薪：</span>
                <strong id="resHourlyProfit">$0 / 小時</strong>
            </div>
            <div class="day-combined-row" id="dayCombinedRow">
                <span>📅 連同呢轉，該日合共淨收入：</span>
                <strong id="resDayCombinedNet">$0</strong>
            </div>
        </div>

        <div class="action-btns">
            <button class="save-btn" id="mainSaveBtn" onclick="saveShiftRecord()">💾 儲存結算並計入紀錄</button>
            <button class="cancel-btn" id="cancelEditBtn" onclick="cancelEdit()">❌ 取消修改</button>
        </div>
    </div>

    <!-- 每日淨收入結算紀錄卡片 -->
    <div class="card">
        <div class="section-header">
            <h3 class="section-title">📅 每日淨收入結算表</h3>
            <input type="month" id="filterMonth" class="date-input" style="width:auto; flex:none; padding:6px 10px; font-size:12px;" onchange="renderAll()">
        </div>
        <div class="history-list" id="historyList"></div>

        <div class="footer-tools">
            <button class="tool-btn" onclick="exportData()">📤 匯出備份</button>
            <button class="tool-btn" onclick="document.getElementById('importInput').click()">📥 匯入還原</button>
            <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
        </div>
    </div>
</div>

<script>
    // 獨立資料庫，避免舊版標籤式資料衝突
    let records = JSON.parse(localStorage.getItem('hk_taxi_ledger_v4')) || [];
    if (records.length === 0) {
        records = JSON.parse(localStorage.getItem('hk_taxi_ledger_v3')) || [];
    }
    
    let currentHours = 6;
    let currentTrips = []; // 暫存每一單收入
    let editingRecordId = null;

    window.onload = () => {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');

        document.getElementById('workDate').value = `${yyyy}-${mm}-${dd}`;
        document.getElementById('filterMonth').value = `${yyyy}-${mm}`;

        const savedStart = localStorage.getItem('hk_taxi_start_time');
        const savedEnd = localStorage.getItem('hk_taxi_end_time');
        if (savedStart) document.getElementById('startTime').value = savedStart;
        if (savedEnd) document.getElementById('endTime').value = savedEnd;

        const savedHourlyRate = localStorage.getItem('hk_taxi_hourly_rate');
        const lastRent = localStorage.getItem('hk_taxi_last_rent');

        calcDurationHours();

        if (savedHourlyRate) {
            document.getElementById('hourlyRate').value = savedHourlyRate;
            document.getElementById('expRent').value = Math.round(parseFloat(savedHourlyRate) * currentHours);
        } else if (lastRent) {
            document.getElementById('expRent').value = lastRent;
        }

        renderTrips();
        calcLive();
        renderAll();
    };

    function onDateChange() {
        calcLive();
        renderAll();
    }

    function calcDurationHours() {
        const startStr = document.getElementById('startTime').value;
        const endStr = document.getElementById('endTime').value;
        if (!startStr || !endStr) {
            currentHours = 0;
            document.getElementById('durationBadge').innerText = `⏱️ 共 0 小時`;
            return;
        }

        const [sh, sm] = startStr.split(':').map(Number);
        const [eh, em] = endStr.split(':').map(Number);

        let startMinutes = sh * 60 + sm;
        let endMinutes = eh * 60 + em;

        if (endMinutes <= startMinutes) {
            endMinutes += 24 * 60;
        }

        const diffHours = (endMinutes - startMinutes) / 60;
        currentHours = Math.round(diffHours * 10) / 10;

        document.getElementById('durationBadge').innerText = `⏱️ 共 ${currentHours} 小時`;
    }

    function onTimeChange() {
        calcDurationHours();
        const rate = getVal('hourlyRate');
        if (rate > 0) {
            document.getElementById('expRent').value = Math.round(rate * currentHours);
        }
        calcLive();
    }

    function onHourlyRateInput() {
        const rate = getVal('hourlyRate');
        if (rate > 0) {
            document.getElementById('expRent').value = Math.round(rate * currentHours);
            localStorage.setItem('hk_taxi_hourly_rate', rate);
        } else {
            localStorage.removeItem('hk_taxi_hourly_rate');
        }
        calcLive();
    }

    function onDirectRentInput() {
        document.getElementById('hourlyRate').value = '';
        localStorage.removeItem('hk_taxi_hourly_rate');
        calcLive();
    }

    function fillLastRent() {
        const lastRent = localStorage.getItem('hk_taxi_last_rent');
        if (lastRent) {
            document.getElementById('expRent').value = lastRent;
            calcLive();
        } else {
            alert('暫時未有上次車租紀錄');
        }
    }

    function getVal(id) {
        return parseFloat(document.getElementById(id).value) || 0;
    }

    function formatMoney(num) {
        return (num >= 0 ? '$' : '-$') + Math.abs(Math.round(num)).toLocaleString();
    }

    // --- 逐單記帳 (清單式渲染) ---
    function addTrip() {
        const input = document.getElementById('tripAmount');
        const val = parseFloat(input.value);
        if (!val || val <= 0) return;
        
        currentTrips.push(val);
        input.value = ''; 
        input.focus();    
        renderTrips();
        calcLive();
    }

    function removeTrip(index) {
        currentTrips.splice(index, 1);
        renderTrips();
        calcLive();
    }

    function renderTrips() {
        const container = document.getElementById('tripListContainer');
        container.innerHTML = '';
        
        if (currentTrips.length === 0) {
            container.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:12px; padding:16px 0;">尚未輸入任何車資，請在上方輸入並撳「➕ 記數」</div>`;
            return;
        }

        // 反向排序顯示，等最新入嗰單喺最頂，唔使成日碌落去
        [...currentTrips].reverse().forEach((amt, reversedIdx) => {
            const realIdx = currentTrips.length - 1 - reversedIdx;
            container.innerHTML += `
                <div class="trip-row-item">
                    <div style="display:flex; align-items:baseline; gap:12px;">
                        <span class="trip-idx">第 ${realIdx + 1} 單</span>
                        <span class="trip-amt">$${amt}</span>
                    </div>
                    <button class="trip-del-btn" onclick="removeTrip(${realIdx})" title="刪除此單">✕</button>
                </div>
            `;
        });
    }

    // 實時計算
    function calcLive() {
        const totalInc = currentTrips.reduce((sum, amt) => sum + amt, 0);
        const rent = getVal('expRent');
        const gas = getVal('expGas');
        const tunnel = getVal('expTunnel');
        const other = getVal('expOther');
        const totalExp = rent + gas + tunnel + other;

        const net = totalInc - totalExp;
        const hourlyProfit = currentHours > 0 ? net / currentHours : 0;

        document.getElementById('liveIncText').innerText = `+$${totalInc.toFixed(0)}`;
        document.getElementById('liveExpText').innerText = `-$${totalExp.toFixed(0)}`;
        document.getElementById('resTotalInc').innerText = `$${totalInc.toFixed(0)}`;
        document.getElementById('resTotalExp').innerText = `$${totalExp.toFixed(0)}`;

        const netEl = document.getElementById('resNetProfit');
        netEl.innerText = formatMoney(net);
        netEl.style.color = net >= 0 ? 'var(--primary)' : 'var(--expense)';

        document.getElementById('resHourlyProfit').innerText = `${formatMoney(hourlyProfit)} / 小時`;

        const selectedDate = document.getElementById('workDate').value;
        
        let existingDayNet = 0;
        records.forEach(r => {
            if (r.date === selectedDate && r.id !== editingRecordId) {
                existingDayNet += r.net;
            }
        });

        const combinedRow = document.getElementById('dayCombinedRow');
        if (existingDayNet !== 0 || editingRecordId) {
            combinedRow.style.display = 'flex';
            document.getElementById('resDayCombinedNet').innerText = formatMoney(existingDayNet + net);
        } else {
            combinedRow.style.display = 'none';
        }
    }

    // ================= 編輯與儲存邏輯 =================
    function editRecord(id) {
        const record = records.find(r => r.id === id);
        if (!record) return;

        editingRecordId = id;

        document.getElementById('workDate').value = record.date;
        document.getElementById('startTime').value = record.startTime;
        document.getElementById('endTime').value = record.endTime;
        
        currentTrips = [...(record.trips || [])];
        renderTrips();

        document.getElementById('expRent').value = record.rent || '';
        document.getElementById('hourlyRate').value = ''; 
        document.getElementById('expGas').value = record.gas || '';
        document.getElementById('expTunnel').value = record.tunnel || '';
        document.getElementById('expOther').value = record.other || '';
        document.getElementById('shiftNote').value = record.note || '';

        document.getElementById('inputCard').classList.add('edit-mode');
        const saveBtn = document.getElementById('mainSaveBtn');
        saveBtn.innerText = '💾 儲存修改';
        saveBtn.style.background = 'linear-gradient(135deg, #10B981 0%, #059669 100%)';
        document.getElementById('cancelEditBtn').style.display = 'block';

        calcDurationHours();
        calcLive();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
        editingRecordId = null;
        currentTrips = [];
        renderTrips();

        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        document.getElementById('workDate').value = `${yyyy}-${mm}-${dd}`;

        document.getElementById('expGas').value = '';
        document.getElementById('expTunnel').value = '';
        document.getElementById('expOther').value = '';
        document.getElementById('shiftNote').value = '';

        document.getElementById('inputCard').classList.remove('edit-mode');
        const saveBtn = document.getElementById('mainSaveBtn');
        saveBtn.innerText = '💾 儲存結算並計入紀錄';
        saveBtn.style.background = 'linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%)';
        document.getElementById('cancelEditBtn').style.display = 'none';

        calcDurationHours();
        calcLive();
    }

    function saveShiftRecord() {
        const date = document.getElementById('workDate').value;
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;
        const timeSlotStr = `🕒 ${startTime}-${endTime} (${currentHours}h)`;

        const totalInc = currentTrips.reduce((sum, amt) => sum + amt, 0);
        const tripCount = currentTrips.length;

        const rent = getVal('expRent');
        const gas = getVal('expGas');
        const tunnel = getVal('expTunnel');
        const other = getVal('expOther');
        const totalExp = rent + gas + tunnel + other;
        const note = document.getElementById('shiftNote').value.trim();

        if (totalInc === 0 && totalExp === 0) {
            alert('請先輸入單程車資或車租開支！');
            return;
        }

        if (!editingRecordId) {
            localStorage.setItem('hk_taxi_start_time', startTime);
            localStorage.setItem('hk_taxi_end_time', endTime);
        }
        if (rent > 0) {
            localStorage.setItem('hk_taxi_last_rent', rent);
        }

        const recordData = {
            date,
            shift: timeSlotStr,
            startTime,
            endTime,
            hours: currentHours,
            trips: [...currentTrips],
            tripCount,
            totalInc,
            rent,
            gas,
            tunnel,
            other,
            totalExp,
            net: totalInc - totalExp,
            note
        };

        if (editingRecordId) {
            recordData.id = editingRecordId;
            const index = records.findIndex(r => r.id === editingRecordId);
            if (index !== -1) {
                records[index] = recordData;
            }
            cancelEdit(); 
        } else {
            recordData.id = 'tx-' + Date.now();
            records.unshift(recordData);
            currentTrips = [];
            renderTrips();
            document.getElementById('expGas').value = '';
            document.getElementById('expTunnel').value = '';
            document.getElementById('expOther').value = '';
            document.getElementById('shiftNote').value = '';
        }

        records.sort((a, b) => b.date.localeCompare(a.date));
        localStorage.setItem('hk_taxi_ledger_v4', JSON.stringify(records));

        calcLive();
        renderAll();
    }

    // ================= 渲染歷史清單 =================
    function renderAll() {
        const selectedDate = document.getElementById('workDate').value;
        const selectedMonth = document.getElementById('filterMonth').value;
        const listEl = document.getElementById('historyList');
        listEl.innerHTML = '';

        const nowStr = new Date().toISOString().slice(0, 10);
        document.getElementById('selectedDayLabel').innerText =
            selectedDate === nowStr ? '📅 今日淨收入' : `📅 ${selectedDate.slice(5)} 淨收入`;

        const dayNet = records
            .filter(r => r.date === selectedDate)
            .reduce((sum, r) => sum + r.net, 0);
        const todayNetEl = document.getElementById('statTodayNet');
        todayNetEl.innerText = formatMoney(dayNet);
        todayNetEl.style.color = dayNet >= 0 ? '#34D399' : 'var(--expense)';

        const filtered = selectedMonth
            ? records.filter(r => r.date.startsWith(selectedMonth))
            : records;

        const dayGroups = {};
        filtered.forEach(r => {
            if (!dayGroups[r.date]) {
                dayGroups[r.date] = {
                    date: r.date,
                    totalHours: 0,
                    totalInc: 0,
                    totalTrips: 0,
                    totalExp: 0,
                    totalRent: 0,
                    totalGas: 0,
                    totalTunnel: 0,
                    totalOther: 0,
                    dailyNet: 0,
                    items: []
                };
            }
            const g = dayGroups[r.date];
            g.totalHours += (r.hours || 0);
            g.totalInc += r.totalInc;
            g.totalTrips += (r.tripCount || 0);
            g.totalExp += r.totalExp;
            g.totalRent += r.rent;
            g.totalGas += r.gas;
            g.totalTunnel += r.tunnel;
            g.totalOther += r.other;
            g.dailyNet += r.net;
            g.items.push(r);
        });

        const sortedDays = Object.values(dayGroups).sort((a, b) => b.date.localeCompare(a.date));

        const monthNet = sortedDays.reduce((sum, d) => sum + d.dailyNet, 0);
        const monthHours = Math.round(sortedDays.reduce((sum, d) => sum + d.totalHours, 0) * 10) / 10;
        const uniqueWorkDays = sortedDays.length;
        const avgDailyNet = uniqueWorkDays > 0 ? Math.round(monthNet / uniqueWorkDays) : 0;

        document.getElementById('statMonthNet').innerText = formatMoney(monthNet);
        document.getElementById('statWorkDays').innerText = `${uniqueWorkDays} 日 (${monthHours}h)`;
        document.getElementById('statAvgDailyNet').innerText = formatMoney(avgDailyNet);

        if (sortedDays.length === 0) {
            listEl.innerHTML = `<div style="text-align:center; padding:30px 0; color:var(--text-muted); font-size:13px;">呢個月暫時未有出車紀錄</div>`;
            return;
        }

        sortedDays.forEach(day => {
            const card = document.createElement('div');
            card.className = `day-group-card ${day.dailyNet < 0 ? 'loss' : ''}`;

            let expBreakdown = [];
            if (day.totalRent > 0) expBreakdown.push(`車租 $${day.totalRent}`);
            if (day.totalGas > 0) expBreakdown.push(`入氣 $${day.totalGas}`);
            if (day.totalTunnel > 0) expBreakdown.push(`隧道 $${day.totalTunnel}`);
            if (day.totalOther > 0) expBreakdown.push(`其他 $${day.totalOther}`);

            let shiftsHtml = '';
            day.items.forEach(item => {
                const tripLabel = item.tripCount > 0 ? `(${item.tripCount} 單)` : '';
                
                // 歷史紀錄加入逐單明細顯示
                let tripDetailsHtml = '';
                if (item.trips && item.trips.length > 0) {
                    tripDetailsHtml = `
                        <div style="font-size:11px; color:var(--text-muted); margin-top:6px; line-height:1.4; border-top:1px dashed rgba(255,255,255,0.1); padding-top:6px;">
                            🧾 <strong>車資明細：</strong> ${item.trips.map(t => '$'+t).join('、')}
                        </div>
                    `;
                }

                shiftsHtml += `
                    <div class="shift-subitem">
                        <div class="shift-sub-top">
                            <div>
                                <span class="shift-badge">${item.shift || '時租'}</span>
                                <span style="color:var(--text-muted); margin-left:6px;">
                                    收 $${item.totalInc} ${tripLabel} | 支 -$${item.totalExp}
                                </span>
                            </div>
                            <div class="action-icon-btns">
                                <strong style="color:${item.net >= 0 ? 'var(--text-main)' : 'var(--expense)'}; margin-right:8px;">
                                    淨收 ${formatMoney(item.net)}
                                </strong>
                                <button class="icon-btn edit-btn" onclick="editRecord('${item.id}')" title="修改此筆">✏️</button>
                                <button class="icon-btn del-btn" onclick="deleteRecord('${item.id}')" title="刪除此筆">✕</button>
                            </div>
                        </div>
                        ${tripDetailsHtml}
                        ${item.note ? `<div style="color:#CBD5E1; margin-top:4px;">📝 ${item.note}</div>` : ''}
                    </div>
                `;
            });

            const hoursLabel = day.totalHours > 0 ? `<span class="day-hours-tag">⏱️ ${Math.round(day.totalHours * 10) / 10} 小時</span>` : '';
            const totalTripsLabel = day.totalTrips > 0 ? ` (共 ${day.totalTrips} 單)` : '';

            card.innerHTML = `
                <div class="day-header">
                    <div class="day-title">
                        <span>📅 ${day.date}</span>
                        ${hoursLabel}
                    </div>
                    <div class="day-net-badge">
                        <span class="day-net-label">當日淨收入</span>
                        <span class="day-net-val" style="color:${day.dailyNet >= 0 ? 'var(--primary)' : 'var(--expense)'}">
                            ${formatMoney(day.dailyNet)}
                        </span>
                    </div>
                </div>
                <div class="day-summary-pills">
                    <span style="color:var(--income); font-weight:bold;">總營業額: +$${day.totalInc} ${totalTripsLabel}</span>
                    <span style="color:var(--expense);">總開支: -$${day.totalExp} (${expBreakdown.join(' · ') || '無'})</span>
                </div>
                ${shiftsHtml}
            `;
            listEl.appendChild(card);
        });
    }

    function deleteRecord(id) {
        if (!confirm('確定要刪除呢筆紀錄嗎？')) return;
        records = records.filter(r => r.id !== id);
        localStorage.setItem('hk_taxi_ledger_v4', JSON.stringify(records));
        
        if (editingRecordId === id) {
            cancelEdit();
        } else {
            calcLive();
            renderAll();
        }
    }

    function exportData() {
        if (records.length === 0) return alert('暫時無紀錄可以匯出！');
        const blob = new Blob([JSON.stringify(records)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `taxi-trip-ledger-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importData(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (!Array.isArray(imported)) throw new Error();
                records = imported;
                localStorage.setItem('hk_taxi_ledger_v4', JSON.stringify(records));
                cancelEdit();
                alert('✅ 成功還原出車紀錄！');
            } catch {
                alert('⚠️ 備份檔案格式不正確！');
            }
        };
        reader.readAsText(file);
    }
</script>
